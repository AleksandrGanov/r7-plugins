<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>R7 Мост</title>
<script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; margin: 12px; font-size: 13px; }
  /* загрузочная строка: единственное видимое содержимое до выполнения code.js */
  #loadingMsg { color: #909090; font-size: 13px; }
  /* code.js находит эти элементы по id и оформляет сам — в разметке они невидимы */
  #status { display: none; }
  #log { display: none; }
</style>
</head>
<body>
  <div id="loadingMsg">Плагин загружается...</div>
  <div id="status"></div>
  <pre id="log"></pre>
  <script src="code.js"></script>
</body>
</html>
